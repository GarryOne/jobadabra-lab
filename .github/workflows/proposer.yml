name: Recipe proposer
# Daily, after the form lab: for the controls that fail (for users or in the lab) and have no recipe yet, ask a small model for a recipe,
# check it with the extension's own validator, and file it as a CANDIDATE on the site. The form lab tries candidates on real public
# pages the next morning and the canary rolls out the ones that work. Capped at --max controls and --budget dollars per run.
# Lives in this private repo because the method and its prompt are part of the product's intelligence.
# Secrets: LAB_KEY (the site's STATS_KEY), ANTHROPIC_API_KEY.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      dry: {description: 'Dry run: ask the model, file nothing', required: false, default: 'false'}
      max: {description: 'Most controls to work on', required: false, default: '20'}

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAB_KEY: ${{ secrets.LAB_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GarryOne/job-pilotto
          path: public
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: The proposer's own tests
        run: node --test proposer/proposer.test.mjs
      - name: Propose recipes
        run: |
          flags=""
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then flags="--dry"; fi
          node proposer/proposer.mjs --extension public/extension --max "${{ github.event.inputs.max || '20' }}" --budget 0.5 --out proposer-result.json $flags | tee proposer.log
      - name: Summary
        if: always()
        run: |
          { echo '### Recipe proposer'; echo; echo '```'; tail -n 40 proposer.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: proposer-result, path: proposer-result.json, retention-days: 14, if-no-files-found: ignore}
