# Job Pilotto — the central scout. Runs the PUBLIC engine's source scout once a day with no user's data (no Notion,
# no Telegram, no AI), verifies every known feed and uploads the employer index to the website worker
# (PUT https://www.jobpilotto.workers.dev/api/index). Apps and Always-on runs download it (GET /api/index).
# Secret: INDEX_PUBLISH_KEY (= the website worker's secret of the same name; Keychain job-pilotto.site.index_publish_key).
name: Central scout
run-name: central scout${{ inputs.batch && format(' {0}', inputs.batch) || '' }}

on:
  schedule:
    - cron: '20 4 * * *'   # UTC, before the users' morning runs
  workflow_dispatch:
    inputs:
      batch: {description: 'candidates to probe this run', required: false, default: '120'}

permissions:
  contents: read

concurrency:
  group: central-scout
  cancel-in-progress: false

env:
  # No user is behind this run: nothing of Notion, Telegram or the AI can start, even if a variable leaks in.
  JOB_PILOTTO_DISABLE: notion,telegram,mail,google_jobs,enrich,score,auto_kits,insights,index
  # Worldwide places (not one user's search): the index serves users everywhere; each app filters by its own search.
  JOB_PILOTTO_LOCATIONS_FILE: config/central_locations.json

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GarryOne/job-pilotto
          ref: main
      - name: This private repo (the curated seed lists)
        uses: actions/checkout@v4
        with:
          path: ops
          sparse-checkout: config
      - name: Load the private seed lists
        run: cp ops/config/scout_seeds.json config/scout_seeds.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the scout's candidate list
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.sqlite
          key: central-scout-db-${{ github.run_id }}
          restore-keys: central-scout-db-
      - name: Scout and publish the index
        env:
          INDEX_PUBLISH_KEY: ${{ secrets.INDEX_PUBLISH_KEY }}
          BATCH: ${{ inputs.batch || '120' }}
        run: python -m src scout --batch "$BATCH" --publish-index
      - name: Tell the owner when it fails
        if: failure()
        env:
          BOT: ${{ secrets.BRAIN_BOT_TOKEN }}
          CHAT: ${{ secrets.BRAIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$BOT" ] && [ -n "$CHAT" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=❌ Central scout failed, the employer index is not updated: ${RUN_URL}" > /dev/null
      - name: Save the scout's candidate list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.sqlite
          key: central-scout-db-${{ github.run_id }}
